<div class="flex gap-4 mt-10 text-sm justify-center items-center" role="radiogroup" aria-labelledby="po-required">
  <div id="po-required" class="font-semibold">PO required:</div>
  <label class="cursor-pointer">
    <input
      type="radio"
      name="po_selection" class="accent-f_green-700"
      value="yes"
      required
    />
    <span>Yes</span>
  </label>
  <label class="cursor-pointer">
    <input
      type="radio"
      name="po_selection" class="accent-f_green-700"
      value="no"
    />
    <span>No</span>
  </label>
</div>
