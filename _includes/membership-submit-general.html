<div class="flex justify-center pt-5 pb-5">
  <button
    class = "button-outline"
    id="submit-membership-btn-general">
    Submit
  </button>
</div>

<script>
  document.getElementById("submit-membership-btn-general").addEventListener("click", async function () {

    // 1. Extract the hidden solution token generated by Friendly Captcha
    // The SDK dynamically creates an input named "frc-captcha-response" inside the widget div
    const captchaHiddenInput = document.querySelector('input[name="frc-captcha-response"]');
    const solutionToken = captchaHiddenInput ? captchaHiddenInput.value : "";

    // 2. Prevent sending if missing token or missing inputs
    if (!solutionToken) {
      // alert("Please complete the captcha challenge before clicking submit.");
      return;
    // }
    // else {
    //   alert("Token found");
    // }

    // 3. Send directly to your Node server
    try {
      const response = await fetch("http://localhost:3000/api/verify-membership", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          solutionToken: solutionToken
        })
      });

      const result = await response.json();

      // if (response.ok && result.success) {
      //   alert("Success! Form received.");
      // } else {
      //   alert("Verification failed: " + (result.message || "Invalid Captcha"));
      // }
    } catch (err) {
      console.error("Fetch error:", err);
      // alert("Could not connect to verification server.");
    }
  });
</script>
